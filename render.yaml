# Render Blueprint for the CEC Extra Classes frontend (static site).
# In Render: New + -> Blueprint -> pick this repo. Render reads this file.
services:
  - type: web
    name: cec-extra-classes
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Read at build time by Vite (see src/services/BaseUrl.js and src/main.jsx)
      - key: VITE_API_BASE_URL
        value: https://cecbackend.onrender.com/api/
      - key: VITE_GOOGLE_CLIENT_ID
        value: 744447080939-74851r8ek6pjl8ogs0q35kmsrmnvs8re.apps.googleusercontent.com
    routes:
      # Single-page app: every path (e.g. /login, /dashboard/123) serves index.html
      # and React Router shows the right page. Real files like /assets/... are served first.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built JS/CSS/images have content hashes in their names, so they can be cached for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
